<!doctype html>

<body>
<!--SPRITE-->

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="Scout Screener home">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#14213d"/><rect x="6" y="7" width="16" height="3.5" rx="1.5" fill="#1f8f4e"/><rect x="6" y="12.25" width="16" height="3.5" rx="1.5" fill="#d99a1c"/><rect x="6" y="17.5" width="10" height="3.5" rx="1.5" fill="#f6f4ee"/></svg>

      <a href="#/" id="nav-jobs"><svg class="ic" aria-hidden="true"><use href="#i-briefcase"/></svg> Jobs <span class="count" id="nav-jobs-count"></span></a>
